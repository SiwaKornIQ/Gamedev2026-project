<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab03 — Animation Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #131A24;
    --panel:   #232E3D;
    --locked:  #3A4350;
    --sand:    #D9C6A5;
    --amber:   #F2A65A;
    --teal:    #4FD1C5;
    --ink:     #EDEAE0;
    --dim:     #8A93A0;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before{
    content:"";
    position: fixed; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events:none; z-index:0;
  }

  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
    position: relative; z-index:1;
  }

  /* ── Back link ── */
  .back{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    text-decoration: none;
    transition: color .15s;
  }
  .back:hover{ color: var(--teal); }
  .back::before{ content: "←"; }

  /* ── Header ── */
  header{ padding: 40px 0 48px; text-align: center; }
  .eyebrow{
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--teal);
    letter-spacing: 0.12em;
    margin-bottom: 16px;
  }
  header h1{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 3.5vw, 22px);
    color: var(--sand);
    text-shadow: 3px 3px 0 #0b1018;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  header p{
    color: var(--dim);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.65;
  }

  /* ── Active player (big view) ── */
  .stage{
    background: var(--panel);
    border: 2px solid var(--locked);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 32px;
    position: relative;
  }

  .stage-screen{
    width: 100%;
    aspect-ratio: 16/9;
    background: #0b1018;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .stage-screen video{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .stage-info{
    padding: 16px 20px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stage-title{
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--teal);
  }

  /* controls */
  .controls{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 7px 14px;
    border-radius: 5px;
    border: 2px solid var(--locked);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, color .15s;
    letter-spacing: 0.04em;
  }
  .btn:hover{ border-color: var(--teal); color: var(--teal); }
  .btn.active{ border-color: var(--teal); color: var(--teal); background: rgba(79,209,197,0.08); }
  .btn-play{
    padding: 8px 18px;
    border-color: var(--teal);
    color: var(--teal);
    font-size: 12px;
  }
  .btn-play:hover{ background: rgba(79,209,197,0.12); }

  /* ── Thumbnail strip ── */
  .strip{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .thumb{
    background: var(--panel);
    border: 2px solid var(--locked);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    position: relative;
  }
  .thumb:hover{ border-color: var(--amber); transform: translateY(-3px); }
  .thumb.active{ border-color: var(--teal); }

  .thumb-screen{
    width: 100%;
    aspect-ratio: 16/9;
    background: #0b1018;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    position: relative;
    overflow: hidden;
  }

  .thumb-screen video{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb-label{
    padding: 8px 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.06em;
  }
  .thumb.active .thumb-label{ color: var(--teal); }

  /* play indicator badge */
  .thumb-badge{
    position: absolute;
    top: 5px; right: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--teal);
    display: none;
    box-shadow: 0 0 6px var(--teal);
  }
  .thumb.active .thumb-badge{ display: block; }

  footer{
    text-align:center;
    margin-top: 60px;
    color: var(--dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
  }
  footer a{ color: var(--teal); text-decoration:none; }

  @media (max-width: 600px){
    .strip{ grid-template-columns: repeat(3, 1fr); }
    .thumb-label{ font-size: 7px; }
    header h1{ font-size: 14px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <a class="back" href="../index.html">กลับหน้าหลัก</a>

  <header>
    <div class="eyebrow">LAB 03 // ANIMATION DEMO</div>
    <h1>CHARACTER<br>ANIMATIONS</h1>
    <p>เลือก animation ที่ต้องการดู กดปุ่ม Loop เพื่อเล่นซ้ำ</p>
  </header>

  <!-- Main stage -->
  <div class="stage">
    <div class="stage-screen">
      <video id="mainVideo" src="Idle.avi" autoplay></video>
    </div>
    <div class="stage-info">
      <span class="stage-title" id="stageTitle">IDLE</span>
      <div class="controls">
        <button class="btn btn-play" id="btnPlayPause" onclick="togglePlay()">▶ PLAY</button>
        <button class="btn" id="btnLoop" onclick="toggleLoop()">⟳ LOOP</button>
        <button class="btn" onclick="restart()">↺ RESTART</button>
      </div>
    </div>
  </div>

  <!-- Thumbnail strip -->
  <div class="strip" id="strip"></div>

  <footer>
    Lab03 · Siwakorn Sangpara · 683380099-0<br>
    <a href="https://github.com" target="_blank" rel="noopener">github.com</a>
  </footer>

</div>

<script>
  const CLIPS = [
    { name: "IDLE",   file: "Idle.avi",   icon: "🧍" },
    { name: "WALK",   file: "Walk.avi",   icon: "🚶" },
    { name: "JUMP",   file: "Jump.avi",   icon: "⬆" },
    { name: "ATTACK", file: "Attack.avi", icon: "⚔️" },
    { name: "DEATH",  file: "Death.avi",  icon: "💀" },
  ];

  let current = 0;
  let looping = false;

  const mainVideo  = document.getElementById('mainVideo');
  const stageTitle = document.getElementById('stageTitle');
  const btnPlay    = document.getElementById('btnPlayPause');
  const btnLoop    = document.getElementById('btnLoop');
  const strip      = document.getElementById('strip');

  // Build thumbnails
  strip.innerHTML = CLIPS.map((c, i) => `
    <div class="thumb ${i === 0 ? 'active' : ''}" id="thumb-${i}" onclick="select(${i})">
      <div class="thumb-screen">
        <video src="${c.file}" muted preload="metadata"></video>
        <div class="thumb-badge"></div>
      </div>
      <div class="thumb-label">${c.name}</div>
    </div>
  `).join('');

  function select(i){
    // deactivate old thumb
    document.getElementById(`thumb-${current}`).classList.remove('active');
    current = i;
    document.getElementById(`thumb-${current}`).classList.add('active');

    const clip = CLIPS[i];
    mainVideo.src = clip.file;
    mainVideo.loop = looping;
    mainVideo.play();
    stageTitle.textContent = clip.name;
    updatePlayBtn();
  }

  function togglePlay(){
    if(mainVideo.paused){ mainVideo.play(); }
    else { mainVideo.pause(); }
    updatePlayBtn();
  }

  function updatePlayBtn(){
    btnPlay.textContent = mainVideo.paused ? '▶ PLAY' : '⏸ PAUSE';
  }

  function toggleLoop(){
    looping = !looping;
    mainVideo.loop = looping;
    btnLoop.classList.toggle('active', looping);
    btnLoop.textContent = looping ? '⟳ LOOP ON' : '⟳ LOOP';
  }

  function restart(){
    mainVideo.currentTime = 0;
    mainVideo.play();
    updatePlayBtn();
  }

  // sync play/pause button with native video events
  mainVideo.addEventListener('play',  updatePlayBtn);
  mainVideo.addEventListener('pause', updatePlayBtn);

  // auto-advance to next clip when done (only when not looping)
  mainVideo.addEventListener('ended', () => {
    if(!looping){
      const next = (current + 1) % CLIPS.length;
      select(next);
    }
  });
</script>

</body>
</html>
